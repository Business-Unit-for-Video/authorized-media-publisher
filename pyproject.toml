[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-image-inventory"
version = "0.1.0"
description = "Build an auditable public image-link inventory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
media-image-inventory = "media_publisher.image_inventory:main"

[tool.setuptools.packages.find]
where = ["src"]
