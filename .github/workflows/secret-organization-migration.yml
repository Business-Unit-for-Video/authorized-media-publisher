name: Secret organization migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: bilibili-publish
    env:
      GH_TOKEN: ${{ secrets.SECRET_MIGRATION_GITHUB_TOKEN }}
      SOURCE_YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE_FILE }}
      SOURCE_BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE_JSON }}
    steps:
      - name: Migrate source and publishing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$SOURCE_YOUTUBE_COOKIE"
          test -n "$SOURCE_BILIBILI_COOKIE"

          printf '%s' "$SOURCE_YOUTUBE_COOKIE" |
            gh secret set YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER \
              --org Business-Unit-for-Video \
              --repos authorized-media-publisher

          printf '%s' "$SOURCE_BILIBILI_COOKIE" |
            gh secret set BILIBILI_PUBLISH_COOKIE_JSON \
              --repo Business-Unit-for-Video/authorized-media-publisher \
              --env bilibili-publish
