name: Build and optionally publish authorized media

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Build only, or upload privately/publicly after build"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - private
          - public
      video_manifest:
        description: "CSV path for explicitly authorized video URLs"
        required: true
        default: "input/videos.csv"
      image_manifest:
        description: "CSV path for authorized images or adult-performer-image-inventory/output/images.csv"
        required: true
        default: "input/images.csv"
      image_rights_basis:
        description: "Documented image ownership/license/consent basis"
        required: true
      image_publish_scope:
        description: "Approved image use scope, for example: Bilibili private review"
        required: true
      video_rights_basis:
        description: "Documented ownership/license basis for the imported video inventory"
        required: true
      video_publish_scope:
        description: "Approved use scope, for example: Bilibili private review"
        required: true
      batch_size:
        description: "Number of new videos to process in this run"
        required: true
        default: "1"
      season_title:
        description: "Bilibili collection title; existing collection is reused by exact title"
        required: true
        default: "音乐视频合集"
      season_description:
        description: "Description used only when creating a new Bilibili collection"
        required: false
        default: ""
      width:
        description: "Output width"
        required: true
        default: "1920"
      height:
        description: "Output height"
        required: true
        default: "1080"

permissions:
  contents: write

concurrency:
  group: authorized-media-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish_mode: ${{ inputs.publish_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install . yt-dlp
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate and build videos
        env:
          VIDEO_MANIFEST: ${{ inputs.video_manifest }}
          IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          OUTPUT_WIDTH: ${{ inputs.width }}
          OUTPUT_HEIGHT: ${{ inputs.height }}
          VIDEO_RIGHTS_BASIS: ${{ inputs.video_rights_basis }}
          VIDEO_PUBLISH_SCOPE: ${{ inputs.video_publish_scope }}
          IMAGE_RIGHTS_BASIS: ${{ inputs.image_rights_basis }}
          IMAGE_PUBLISH_SCOPE: ${{ inputs.image_publish_scope }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          media-publisher \
            --videos "$VIDEO_MANIFEST" \
            --images "$IMAGE_MANIFEST" \
            --width "$OUTPUT_WIDTH" \
            --height "$OUTPUT_HEIGHT" \
            --video-rights-basis "$VIDEO_RIGHTS_BASIS" \
            --video-publish-scope "$VIDEO_PUBLISH_SCOPE" \
            --image-rights-basis "$IMAGE_RIGHTS_BASIS" \
            --image-publish-scope "$IMAGE_PUBLISH_SCOPE" \
            --publish-state state/publish-state.json \
            --batch-size "$BATCH_SIZE"
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: authorized-media-${{ github.run_id }}
          path: output/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish_mode != 'build' }}
    runs-on: ubuntu-latest
    environment: bilibili-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publisher and Biliup uploader
        run: python -m pip install . biliup==1.2.2
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: authorized-media-${{ github.run_id }}
          path: output/
      - name: Write Bilibili cookie file
        env:
          BILIBILI_COOKIE_JSON: ${{ secrets.BILIBILI_COOKIE_JSON }}
        run: |
          test -n "$BILIBILI_COOKIE_JSON"
          printf '%s' "$BILIBILI_COOKIE_JSON" > "$RUNNER_TEMP/cookies.json"
          chmod 600 "$RUNNER_TEMP/cookies.json"
      - name: Configure state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish and attach to collection
        env:
          SEASON_TITLE: ${{ inputs.season_title }}
          SEASON_DESCRIPTION: ${{ inputs.season_description }}
        run: >-
          media-publish-bilibili
          --report output/build-report.json
          --cookies "$RUNNER_TEMP/cookies.json"
          --visibility "${{ inputs.publish_mode }}"
          --state state/publish-state.json
          --season-title "$SEASON_TITLE"
          --season-description "$SEASON_DESCRIPTION"
          --run-id "${{ github.run_id }}"
