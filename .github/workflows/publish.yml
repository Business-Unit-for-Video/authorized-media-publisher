name: Publish authorized media

on:
  workflow_dispatch:
    inputs:
      video_manifest:
        description: "CSV path for explicitly authorized video URLs"
        required: true
        default: "input/guodegang-early-successes.csv"
      image_manifest:
        description: "CSV path for authorized images or adult-performer-image-inventory/output/images.csv"
        required: true
        default: "input/images.csv"
      batch_size:
        description: "Maximum number of new videos to process serially in this run"
        required: true
        default: "2"
      content_policy:
        description: "Only publish explicitly marked long-form courses/lectures"
        required: true
        default: "long_form"
        type: choice
        options:
          - long_form
          - all
      min_duration_seconds:
        description: "Minimum duration for rows that do not set content_type=long_form"
        required: true
        default: "1800"
      season_title:
        description: "Bilibili collection title; existing collection is reused by exact title"
        required: true
        default: "于纲"
      season_description:
        description: "Description used only when creating a new Bilibili collection"
        required: false
        default: ""
      width:
        description: "Output width"
        required: true
        default: "1920"
      height:
        description: "Output height"
        required: true
        default: "1080"
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: authorized-media-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: bilibili-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publisher, downloader, uploader, and FFmpeg
        run: |
          python -m pip install . yt-dlp biliup==1.2.2
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Write credential files
        env:
          YOUTUBE_COOKIE_FILE: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER }}
          BILIBILI_COOKIE_JSON: ${{ secrets.BILIBILI_PUBLISH_COOKIE_JSON }}
        run: |
          if [ -n "$YOUTUBE_COOKIE_FILE" ]; then
            printf '%s' "$YOUTUBE_COOKIE_FILE" > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
          fi
          test -n "$BILIBILI_COOKIE_JSON"
          printf '%s' "$BILIBILI_COOKIE_JSON" > "$RUNNER_TEMP/bilibili-cookies.json"
          chmod 600 "$RUNNER_TEMP/bilibili-cookies.json"
      - name: Configure state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check recent submissions before publishing
        env:
          VIDEO_MANIFEST: ${{ inputs.video_manifest || 'input/guodegang-early-successes.csv' }}
        run: |
          python scripts/check_recent_bilibili_reviews.py \
            --cookies "$RUNNER_TEMP/bilibili-cookies.json" \
            --state state/publish-state.json \
            --videos "$VIDEO_MANIFEST" \
            --output output/recent-review-check.json \
            --limit 2
      - name: Build and publish each video serially
        env:
          VIDEO_MANIFEST: ${{ inputs.video_manifest || 'input/guodegang-early-successes.csv' }}
          IMAGE_MANIFEST: ${{ inputs.image_manifest || 'input/images.csv' }}
          OUTPUT_WIDTH: ${{ inputs.width || '1920' }}
          OUTPUT_HEIGHT: ${{ inputs.height || '1080' }}
          BATCH_SIZE: ${{ inputs.batch_size || '2' }}
          CONTENT_POLICY: ${{ inputs.content_policy || 'long_form' }}
          MIN_DURATION_SECONDS: ${{ inputs.min_duration_seconds || '1800' }}
          SEASON_TITLE: ${{ inputs.season_title || '于纲' }}
          SEASON_DESCRIPTION: ${{ inputs.season_description || '' }}
          YOUTUBE_COOKIE_PATH: ${{ runner.temp }}/youtube-cookies.txt
        run: |
          YOUTUBE_COOKIE_ARGS=()
          if [ -f "$YOUTUBE_COOKIE_PATH" ]; then
            YOUTUBE_COOKIE_ARGS=(--youtube-cookies "$YOUTUBE_COOKIE_PATH")
          fi
          media-publish-serial \
            --videos "$VIDEO_MANIFEST" \
            --images "$IMAGE_MANIFEST" \
            --width "$OUTPUT_WIDTH" \
            --height "$OUTPUT_HEIGHT" \
            --state state/publish-state.json \
            --batch-size "$BATCH_SIZE" \
            --content-policy "$CONTENT_POLICY" \
            --min-duration-seconds "$MIN_DURATION_SECONDS" \
            --bilibili-cookies "$RUNNER_TEMP/bilibili-cookies.json" \
            --visibility public \
            --season-title "$SEASON_TITLE" \
            --season-description "$SEASON_DESCRIPTION" \
            --run-id "${{ github.run_id }}" \
            "${YOUTUBE_COOKIE_ARGS[@]}"
      - name: Upload publish report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: authorized-media-publisher-report-${{ github.run_id }}
          path: |
            output/build-report.json
            state/publish-state.json
            output/recent-review-check.json
          if-no-files-found: ignore
