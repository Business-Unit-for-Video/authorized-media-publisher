name: 同步 YouTube 频道发布清单

on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * *'

permissions:
  contents: write

concurrency:
  group: authorized-media-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: 从公开转写仓库更新视频和文档清单
        run: python scripts/sync_channel_manifests.py
      - name: 提交更新
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add input/xiaodaodalang.csv input/betterleaf.csv docs/channel-document-lists.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync public channel video catalogs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
