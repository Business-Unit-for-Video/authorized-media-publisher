[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-authorized-media-publisher"
version = "0.1.0"
description = "Create and optionally publish videos from explicitly authorized media manifests"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
media-publisher = "media_publisher.cli:main"
media-publish-bilibili = "media_publisher.publish:main"
media-publish-serial = "media_publisher.serial:main"
media-image-inventory = "media_publisher.image_inventory:main"

[tool.setuptools.packages.find]
where = ["src"]
