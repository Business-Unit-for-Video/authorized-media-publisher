name: Refresh public image inventory

on:
  workflow_dispatch:
    inputs:
      limit_per_query:
        description: "Maximum Wikimedia Commons files per query"
        required: true
        default: "20"
  schedule:
    - cron: "29 4 * * 1"

permissions:
  contents: write

concurrency:
  group: public-image-inventory
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install .
      - name: Scan metadata-rich public source
        env:
          RESULT_LIMIT: ${{ inputs.limit_per_query }}
        run: media-image-inventory --limit "${RESULT_LIMIT:-20}"
      - name: Upload image-link inventory
        uses: actions/upload-artifact@v4
        with:
          name: public-image-inventory-${{ github.run_id }}
          path: output/
          if-no-files-found: error
      - name: Commit refreshed inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/
          if git diff --cached --quiet; then
            echo "Inventory unchanged"
          else
            git commit -m "data: refresh public image inventory"
            git push origin HEAD:main
          fi
