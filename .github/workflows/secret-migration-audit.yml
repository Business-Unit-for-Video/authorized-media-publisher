name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: bilibili-publish
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          YOUTUBE_COOKIE_FILE: ${{ secrets.YOUTUBE_COOKIE_FILE }}
          YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER }}
          BILIBILI_COOKIE_JSON: ${{ secrets.BILIBILI_COOKIE_JSON }}
          BILIBILI_PUBLISH_COOKIE_JSON: ${{ secrets.BILIBILI_PUBLISH_COOKIE_JSON }}
        run: |
          set -euo pipefail

          audit() {
            local name="$1"
            local value="$2"
            local expected_format="$3"

            if [[ -z "$value" ]]; then
              echo "$name present=false"
              return
            fi

            local bytes digest valid
            bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
            valid=false

            if [[ "$expected_format" == "netscape" && "$value" == *$'\t'* ]]; then
              valid=true
            elif [[ "$expected_format" == "json" ]] && printf '%s' "$value" | jq -e . >/dev/null 2>&1; then
              valid=true
            fi

            echo "$name present=true bytes=$bytes sha256_16=$digest format=$expected_format valid=$valid"
          }

          audit YOUTUBE_COOKIE_FILE "${YOUTUBE_COOKIE_FILE:-}" netscape
          audit YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER "${YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER:-}" netscape
          audit BILIBILI_COOKIE_JSON "${BILIBILI_COOKIE_JSON:-}" json
          audit BILIBILI_PUBLISH_COOKIE_JSON "${BILIBILI_PUBLISH_COOKIE_JSON:-}" json

          [[ "$YOUTUBE_COOKIE_FILE" == "$YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER" ]] && echo "youtube_migration_match=true" || echo "youtube_migration_match=false"
          [[ "$BILIBILI_COOKIE_JSON" == "$BILIBILI_PUBLISH_COOKIE_JSON" ]] && echo "bilibili_migration_match=true" || echo "bilibili_migration_match=false"
