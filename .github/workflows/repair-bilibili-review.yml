name: 修复被退回稿件并重新发布

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "要处理的清单路径"
        required: true
        default: "input/reprocess-jay-chou-2026-10-07.csv"
      season_title:
        description: "合集名称（于纲或周杰伦）"
        required: true
        default: "周杰伦"
      batch_size:
        description: "本次最多处理几条（建议 1）"
        required: true
        default: "1"
      width:
        description: "输出宽度"
        required: true
        default: "1920"
      height:
        description: "输出高度"
        required: true
        default: "1080"

permissions:
  contents: write

concurrency:
  group: authorized-media-publisher-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: bilibili-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装发布器、下载器、上传器和 FFmpeg
        run: |
          python -m pip install . yt-dlp biliup==1.2.11
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: 写入临时凭据文件
        env:
          YOUTUBE_COOKIE_FILE: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_AUTHORIZED_PUBLISHER }}
          BILIBILI_COOKIE_JSON: ${{ secrets.BILIBILI_PUBLISH_COOKIE_JSON }}
        run: |
          if [ -n "$YOUTUBE_COOKIE_FILE" ]; then
            printf '%s' "$YOUTUBE_COOKIE_FILE" > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            python scripts/validate_youtube_cookies.py "$RUNNER_TEMP/youtube-cookies.txt"
          fi
          test -n "$BILIBILI_COOKIE_JSON"
          printf '%s' "$BILIBILI_COOKIE_JSON" > "$RUNNER_TEMP/bilibili-cookies.json"
          chmod 600 "$RUNNER_TEMP/bilibili-cookies.json"
      - name: 配置状态提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 串行剪辑并公开发布修复稿
        env:
          YOUTUBE_COOKIE_PATH: ${{ runner.temp }}/youtube-cookies.txt
        run: |
          YOUTUBE_COOKIE_ARGS=()
          if [ -f "$YOUTUBE_COOKIE_PATH" ]; then
            YOUTUBE_COOKIE_ARGS=(--youtube-cookies "$YOUTUBE_COOKIE_PATH")
          fi
          media-publish-serial \
            --videos "${{ inputs.manifest }}" \
            --images input/images.csv \
            --width "${{ inputs.width || '1920' }}" \
            --height "${{ inputs.height || '1080' }}" \
            --state state/publish-state.json \
            --batch-size "${{ inputs.batch_size || '1' }}" \
            --bilibili-cookies "$RUNNER_TEMP/bilibili-cookies.json" \
            --visibility public \
            --season-title "${{ inputs.season_title }}" \
            --season-description "根据审核意见剪除指定时间段或更换合规封面" \
            --run-id "${{ github.run_id }}" \
            "${YOUTUBE_COOKIE_ARGS[@]}"
      - name: 上传修复报告
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-repair-report-${{ github.run_id }}
          path: |
            output/build-report.json
            state/publish-state.json
          if-no-files-found: ignore
