name: Build and optionally publish authorized media

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Build only, or build and upload one item at a time"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - private
          - public
      video_manifest:
        description: "CSV path for explicitly authorized video URLs"
        required: true
        default: "input/videos.csv"
      image_manifest:
        description: "CSV path for authorized images or adult-performer-image-inventory/output/images.csv"
        required: true
        default: "input/images.csv"
      batch_size:
        description: "Maximum number of new videos to process serially in this run"
        required: true
        default: "1"
      season_title:
        description: "Bilibili collection title; existing collection is reused by exact title"
        required: true
        default: "音乐视频合集"
      season_description:
        description: "Description used only when creating a new Bilibili collection"
        required: false
        default: ""
      width:
        description: "Output width"
        required: true
        default: "1920"
      height:
        description: "Output height"
        required: true
        default: "1080"

permissions:
  contents: write

concurrency:
  group: authorized-media-publisher
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.publish_mode == 'build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install . yt-dlp
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Write optional YouTube cookie file
        env:
          YOUTUBE_COOKIE_FILE: ${{ secrets.YOUTUBE_COOKIE_FILE }}
        run: |
          if [ -n "$YOUTUBE_COOKIE_FILE" ]; then
            printf '%s' "$YOUTUBE_COOKIE_FILE" > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
          fi
      - name: Validate and build videos
        env:
          VIDEO_MANIFEST: ${{ inputs.video_manifest }}
          IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          OUTPUT_WIDTH: ${{ inputs.width }}
          OUTPUT_HEIGHT: ${{ inputs.height }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          YOUTUBE_COOKIE_PATH: ${{ runner.temp }}/youtube-cookies.txt
        run: |
          YOUTUBE_COOKIE_ARGS=()
          if [ -f "$YOUTUBE_COOKIE_PATH" ]; then
            YOUTUBE_COOKIE_ARGS=(--youtube-cookies "$YOUTUBE_COOKIE_PATH")
          fi
          media-publisher \
            --videos "$VIDEO_MANIFEST" \
            --images "$IMAGE_MANIFEST" \
            --width "$OUTPUT_WIDTH" \
            --height "$OUTPUT_HEIGHT" \
            --publish-state state/publish-state.json \
            --batch-size "$BATCH_SIZE" \
            "${YOUTUBE_COOKIE_ARGS[@]}"
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: authorized-media-${{ github.run_id }}
          path: output/
          if-no-files-found: error

  serial_publish:
    if: ${{ inputs.publish_mode != 'build' }}
    runs-on: ubuntu-latest
    environment: bilibili-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publisher, downloader, uploader, and FFmpeg
        run: |
          python -m pip install . yt-dlp biliup==1.2.2
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Write credential files
        env:
          YOUTUBE_COOKIE_FILE: ${{ secrets.YOUTUBE_COOKIE_FILE }}
          BILIBILI_COOKIE_JSON: ${{ secrets.BILIBILI_COOKIE_JSON }}
        run: |
          if [ -n "$YOUTUBE_COOKIE_FILE" ]; then
            printf '%s' "$YOUTUBE_COOKIE_FILE" > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
          fi
          test -n "$BILIBILI_COOKIE_JSON"
          printf '%s' "$BILIBILI_COOKIE_JSON" > "$RUNNER_TEMP/bilibili-cookies.json"
          chmod 600 "$RUNNER_TEMP/bilibili-cookies.json"
      - name: Configure state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and publish each video serially
        env:
          VIDEO_MANIFEST: ${{ inputs.video_manifest }}
          IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          OUTPUT_WIDTH: ${{ inputs.width }}
          OUTPUT_HEIGHT: ${{ inputs.height }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SEASON_TITLE: ${{ inputs.season_title }}
          SEASON_DESCRIPTION: ${{ inputs.season_description }}
          YOUTUBE_COOKIE_PATH: ${{ runner.temp }}/youtube-cookies.txt
        run: |
          YOUTUBE_COOKIE_ARGS=()
          if [ -f "$YOUTUBE_COOKIE_PATH" ]; then
            YOUTUBE_COOKIE_ARGS=(--youtube-cookies "$YOUTUBE_COOKIE_PATH")
          fi
          media-publish-serial \
            --videos "$VIDEO_MANIFEST" \
            --images "$IMAGE_MANIFEST" \
            --width "$OUTPUT_WIDTH" \
            --height "$OUTPUT_HEIGHT" \
            --state state/publish-state.json \
            --batch-size "$BATCH_SIZE" \
            --bilibili-cookies "$RUNNER_TEMP/bilibili-cookies.json" \
            --visibility "${{ inputs.publish_mode }}" \
            --season-title "$SEASON_TITLE" \
            --season-description "$SEASON_DESCRIPTION" \
            --run-id "${{ github.run_id }}" \
            "${YOUTUBE_COOKIE_ARGS[@]}"
